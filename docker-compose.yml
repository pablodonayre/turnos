version: "3"
services:
  shift:
    build: .
    restart: "unless-stopped"
    env_file:
       - "./.env"
    volumes:
       - ./src:/app      
       - /app/node_modules
    ports:
       - "8086:3000"
    command: npm run start
   
  caddy:
    image: abiosoft/caddy:no-stats
    restart: "no"
   #  ports:
   #    - "80:80"
   #    - "443:443"
    environment:
      ACME_AGREE: 1
    volumes:
      - "./conf/Caddyfile:/etc/Caddyfile"
      - "./caddy:/root/.caddy"
    network_mode: "host"

